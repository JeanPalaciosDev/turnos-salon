# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/cli/config
# This identifier is local to the CLI; it is not a hosted Supabase project reference.
project_id = "turnos-salon"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = false
